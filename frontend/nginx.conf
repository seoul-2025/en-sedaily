# Nginx configuration for Seoul Economic Daily English Site
# Place this file in /etc/nginx/sites-available/sedaily-eng

upstream nextjs {
    # PM2 cluster mode will handle load balancing
    server localhost:3000;
    keepalive 64;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name en.sedaily.com en.sedaily.ai;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name en.sedaily.com en.sedaily.ai;
    
    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/en.sedaily.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/en.sedaily.com/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_comp_level 6;
    
    # Logging
    access_log /var/log/nginx/sedaily-access.log;
    error_log /var/log/nginx/sedaily-error.log;
    
    # Rate limiting
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # API routes (higher rate limit)
    location /api {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files (Next.js will handle these, but can be optimized)
    location /_next/static {
        proxy_pass http://nextjs;
        
        # Long cache for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Public files
    location /public {
        proxy_pass http://nextjs;
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://nextjs;
    }
    
    # Robots.txt
    location /robots.txt {
        proxy_pass http://nextjs;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Sitemap
    location /sitemap.xml {
        proxy_pass http://nextjs;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}